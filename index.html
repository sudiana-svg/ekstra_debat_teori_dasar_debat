<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe - Teori Dasar Debat</title><style>
:root{--bg:#eaf3e6;--ink:#10321f;--card:#fff;--x:#2563eb;--o:#dc2626;--g:#166534;--line:#b7d3bd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif}
header{text-align:center;padding:12px 10px 4px}
h1{margin:0;font-size:clamp(1.2rem,3.2vw,2rem);color:var(--g)}
header p{margin:2px 0 0;font-size:.9rem;opacity:.75}
.score{display:flex;justify-content:center;gap:14px;margin:8px auto;padding:0 10px}
.sb{min-width:120px;padding:6px 18px;border-radius:14px;color:#fff;text-align:center;font-weight:700}
.sb b{display:block;font-size:2rem;line-height:1.1}
.sb.x{background:var(--x)}.sb.o{background:var(--o)}
.stage{flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;justify-items:center;padding:8px 12px;max-width:1200px;width:100%;margin:0 auto}
.turn{width:min(100%,170px);aspect-ratio:1;border:4px solid transparent;border-radius:22px;font-size:clamp(3rem,9vw,5.5rem);font-weight:900;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.55;transition:.2s}
.turn small{font-size:.9rem;font-weight:700}
#bx{background:var(--x)}#bo{background:var(--o)}
.turn.on{opacity:1;transform:scale(1.07);border-color:#fbbf24;box-shadow:0 0 0 5px #fde68a,0 8px 20px #0004}
.wrap{position:relative;width:min(92vw,calc(100vh - 360px),640px);min-width:270px;aspect-ratio:1}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;height:100%}
.cell{container-type:size;position:relative;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--g);font-weight:800;font-size:clamp(1.2rem,5vw,2.4rem);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.cell:hover:not(:disabled){background:#f0fdf4;transform:scale(1.03)}
.cell:disabled{cursor:default}
.cell.x{background:var(--x);border-color:var(--x);color:#fff}.cell.o{background:var(--o);border-color:var(--o);color:#fff}
.cell span{font-size:78cqmin;line-height:1;font-weight:900}
.cell.bad{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
svg.win{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg.win line{stroke:#facc15;stroke-width:3.2;stroke-linecap:round;filter:drop-shadow(0 0 1.5px #000);stroke-dasharray:140;stroke-dashoffset:140;animation:dr .7s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:10px;z-index:9}
.ov.show{display:flex}
.modal{background:#fff;border-radius:18px;width:min(720px,100%);max-height:94vh;overflow:auto;padding:16px 18px}
.modal h2{margin:0 0 8px;font-size:1.05rem;color:var(--g)}
.ref{background:#f1f8f2;border-left:5px solid var(--g);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:.95rem;line-height:1.5}
.ref b{color:var(--g)}
.q{font-size:1.15rem;font-weight:700;margin:6px 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:1rem;cursor:pointer;color:var(--ink)}
.opt:hover{background:#f0fdf4;border-color:var(--g)}
.opt i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--g);color:#fff;font-style:normal;font-weight:700;display:grid;place-items:center}
.pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pie div.c{width:110px;height:110px;border-radius:50%;background:conic-gradient(#16a34a 0 40%,#f59e0b 40% 75%,#3b82f6 75% 90%,#9ca3af 90%)}
.tools{display:flex;justify-content:center;gap:10px;padding:6px}
.btn{border:0;border-radius:10px;padding:9px 18px;background:var(--g);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.l{background:#e5e7eb;color:var(--ink)}
.win-box{text-align:center}.win-box h2{font-size:2rem;margin:4px}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
footer{text-align:center;padding:10px;font-size:.9rem;font-weight:700;color:var(--g)}
.ids{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.ids input{padding:7px 12px;border:2px solid var(--line);border-radius:10px;font:inherit;min-width:180px;background:#fff;color:var(--ink)}
.tools{flex-wrap:wrap}.tools .btn{display:inline-block}
.cell.dead{background:#d1d5db;border-color:#9ca3af;color:#6b7280}.cell.dead span{font-size:50cqmin}
.tm{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tm .bar{flex:1;height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden}
#tb{height:100%;width:100%;background:#16a34a;transition:width 1s linear}
.tm b{font-size:1.4rem;min-width:36px;text-align:right}
.info{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.info span{background:#fff;border:2px solid var(--line);padding:5px 14px;border-radius:20px;font-weight:700;color:var(--ink)}
.start{text-align:center;color:#fff}.start h1{color:#fff;font-size:clamp(2.6rem,10vw,5.5rem);margin:0 0 8px}
.start .info{margin-bottom:24px}
.go{font-size:1.7rem;padding:16px 46px;background:#facc15;color:#10321f;border-radius:40px}
#cd{min-height:1.1em;font-size:clamp(6rem,30vw,14rem);font-weight:900;line-height:1.1}
#cd .n{display:inline-block;animation:pop .9s}
@keyframes pop{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}
.player .cell,.player .turn{pointer-events:none}.player #reset,.player .tools{display:none}
@media(max-width:720px){
 .stage{grid-template-columns:1fr 1fr;grid-template-areas:"b b" "x o"}
 .wrap{grid-area:b}#bx{grid-area:x;justify-self:end}#bo{grid-area:o;justify-self:start}
 .turn{width:min(100%,120px);font-size:3rem}
}
</style></head><body>

const gathered=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);r()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(r,5000)});
function copyText(v){const done=()=>toast('Kode disalin');
 const fb=()=>{const t=document.createElement('textarea');t.value=v;t.style.cssText='position:fixed;left:0;top:0;opacity:0;font-size:16px';document.body.appendChild(t);t.focus();t.select();try{t.setSelectionRange(0,v.length)}catch(e){}let r=false;try{r=document.execCommand('copy')}catch(e){}t.remove();toast(r?'Kode disalin':'Gagal menyalin. Pakai tombol 📤 Kirim.')};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,fb);else fb()}
function copy(id){const t=typeof id==='string'?$(id):id;copyText(t.value)}
function send(v){const w=()=>window.open('https://wa.me/?text='+encodeURIComponent(v),'_blank');if(navigator.share)navigator.share({text:v}).catch(e=>{if(!e||e.name!=='AbortError')w()});else w()}
function mkR(kind){return{presence:async p=>{const m=JSON.stringify(kind==='h'?(mrg(hostPres,p),{h:hostPres}):(mrg(myPres,p),{p:myPres}));chs.forEach(c=>c.readyState==='open'&&c.send(m))},
 peers:()=>kind==='h'?Object.values(PP).map(x=>({presence:x})):[{presence:hostPres}],onPeers:f=>{cbs.push(f)}}}
function wire(ch,id){chs.push(ch);
 ch.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
  if(role==='h'&&m.p&&typeof m.p==='object'){PP[id]=m.p;fire()}else if(role==='p'&&m.h&&typeof m.h==='object'){hostPres=m.h;fire()}};
 ch.onopen=()=>{if(role==='h'){pub();toast('Perangkat tersambung');fire()}else{lanOff();ch.send(JSON.stringify({p:myPres}));const o=$('pov');o&&o.remove();$('st').hidden=false;toast('Tersambung ke host')}};
 ch.onclose=()=>{chs=chs.filter(c=>c!==ch);delete PP[id];fire();toast('Perangkat terputus')};if(ch.readyState==='open')ch.onopen()}
function pov(h){let o=$('pov');if(!o){o=document.createElement('div');o.className='ov show';o.id='pov';o.style.zIndex=40;o.innerHTML='<div class="modal" id="pm" style="max-width:540px"></div>';document.body.appendChild(o)}$('pm').innerHTML=h}
const TA='style="width:100%;font-size:.7rem;border:2px solid var(--line);border-radius:8px;padding:6px"';
function pmenu(){if(role==='p'){toast('Perangkat ini sudah menjadi pemain');return}
 pov(`<h2 style="font-size:1.3rem">🔗 Mode 2 Perangkat (tanpa server)</h2><p>Perangkat dihubungkan dengan kode yang disalin dan ditempel (mis. lewat WhatsApp). Perlu internet.</p><button class="btn" id="m1" style="width:100%;margin:4px 0">Saya Guru (Host) — layar utama</button><button class="btn" id="m2" style="width:100%;margin:4px 0;background:var(--x)">Saya Siswa — Tim X</button><button class="btn" id="m3" style="width:100%;margin:4px 0;background:var(--o)">Saya Siswa — Tim O</button><button class="btn l" id="m5" style="width:100%;margin:4px 0">🏠 Wi-Fi sama tapi gagal? Aktifkan mode jaringan lokal</button><p style="font-size:.8rem;margin:0 0 6px">Ini meminta izin mikrofon hanya agar browser menampilkan alamat jaringan lokal. Suara tidak direkam. Lakukan di kedua perangkat sebelum membuat kode.</p><button class="btn l" id="m4" style="width:100%;margin:4px 0">Tutup</button>`);
 $('m1').onclick=newOffer;$('m2').onclick=()=>playerFlow('X');$('m3').onclick=()=>playerFlow('O');$('m4').onclick=()=>$('pov').remove();$('m5').onclick=lan;if(lanStream)$('m5').textContent='✓ Mode jaringan lokal aktif'}
function hostPanel(){pov(`<h2>Hubungkan perangkat siswa</h2><p>Satu kotak untuk setiap perangkat. Tambahkan satu perangkat untuk Tim X dan satu untuk Tim O.</p><div id="sl"></div><p><button class="btn" id="ad">＋ Tambah perangkat</button> <button class="btn l" id="cl">Selesai</button></p>`);
 slots.forEach(x=>$('sl').appendChild(x.el));$('ad').onclick=addSlot;$('cl').onclick=()=>{lanOff();$('pov').remove()}}
function newOffer(){if(!window.RTCPeerConnection){toast('Browser ini tidak mendukung WebRTC');return}
 if(role!=='h'){role='h';R=mkR('h');R.onPeers(hostPeers);$('st').hidden=false;pub();hostPeers()}
 hostPanel();if(!slots.length)addSlot()}
async function addSlot(){
 const id='d'+(++pend),pc=new RTCPeerConnection(ICE),ch=pc.createDataChannel('g');wire(ch,id);
 const el=document.createElement('div');el.style.cssText='border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0';
 el.innerHTML=`<b class="hd">Perangkat ${slots.length+1}</b> — <span class="ss">menunggu jawaban…</span><p style="margin:6px 0 2px">1. Salin kode ini, kirim ke HP siswa:</p><textarea rows="3" inputmode="none" onfocus="this.select()" class="oc" ${TA}></textarea><p style="margin:4px 0"><button class="btn cp">📋 Salin Kode</button> <button class="btn sd">📤 Kirim</button> <button class="btn l fl">Coba kode ringkas</button></p><p class="nt" style="margin:2px 0;font-size:.8rem;color:#92400e"></p><p style="margin:6px 0 2px">2. Tempel kode jawaban dari siswa ini:</p><textarea rows="3" class="ac" ${TA} placeholder="Tempel kode jawaban perangkat ini di sini"></textarea><p style="margin:4px 0"><button class="btn cn">Sambungkan</button> <span class="er" style="color:#b91c1c;font-size:.85rem"></span></p>`;
 const q=c=>el.querySelector(c);const x={id,el,ss:q('.ss'),pc,st:'',applied:false};slots.push(x);pc.oniceconnectionstatechange=()=>{x.st=pc.iceConnectionState;fire()};$('sl').appendChild(el);q('.oc').value='Menyiapkan kode…';
 await pc.setLocalDescription(await pc.createOffer());await gathered(pc);q('.oc').value=enc(pc.localDescription,true);if(/\.local\b/.test(pc.localDescription.sdp)&&!lanStream)q('.nt').textContent=NOTE;
 const n=slots.indexOf(x)+1,tag=idOf(pc.localDescription.sdp);x.tag=tag;x.lb='[Perangkat '+n+' · ID '+tag+'] ';q('.oc').value=x.lb+q('.oc').value;q('.hd').textContent='Perangkat '+n+' · ID '+tag;
 q('.cp').onclick=()=>copy(q('.oc'));q('.sd').onclick=()=>send(q('.oc').value);q('.fl').onclick=()=>{q('.oc').value=x.lb+enc(pc.localDescription);toast('Kode ringkas ditampilkan. Salin lagi.')};
 q('.cn').onclick=async()=>{if(x.applied||pc.signalingState==='stable'){q('.er').textContent='Jawaban sudah dimasukkan. Menunggu koneksi…';return}
  const mt=q('.ac').value.match(/untuk ID ([A-Za-z0-9]{5})/);if(mt&&mt[1]!==x.tag){const o=slots.find(z=>z.tag===mt[1]);q('.er').textContent=o?'Kode jawaban ini untuk '+o.el.querySelector('.hd').textContent+'. Tempel di kotak itu.':'Kode jawaban ini bukan untuk kotak ini (ID '+mt[1]+'). Periksa kode yang dikirim ke siswa.';return}
  try{await pc.setRemoteDescription(dec(q('.ac').value));x.applied=true;q('.er').textContent='';toast('Menyambungkan…');fire();
   setTimeout(()=>{if(!PP[id]){x.st='failed';fire();q('.er').textContent=ADV}},20000)}catch(e){const m=errm(e);q('.er').textContent=m;toast(m)}}}
function playerFlow(team){if(!window.RTCPeerConnection){toast('Browser ini tidak mendukung WebRTC');return}
 pov(`<h2>Gabung sebagai Tim ${team}</h2><p><b>Langkah 1.</b> Tempel kode dari guru:</p><textarea id="oc" rows="4" ${TA} placeholder="Tempel kode dari guru di sini"></textarea><p><button class="btn" id="mk">Buat Kode Jawaban</button> <button class="btn l" id="cl">Batal</button></p><div id="ans"></div><p id="er" style="color:#b91c1c;font-size:.85rem"></p>`);
 $('cl').onclick=()=>$('pov').remove();
 $('mk').onclick=async()=>{try{const tg=(($('oc').value.match(/ID ([A-Za-z0-9]{5})/)||[])[1])||'';const pc=new RTCPeerConnection(ICE);pc.ondatachannel=e=>wire(e.channel,'h');
  role='p';myTeam=team;R=mkR('p');myPres={r:'p',team};cbs=[];R.onPeers(playerPeers);document.body.classList.add('player');
  await pc.setRemoteDescription(dec($('oc').value));await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);const c=enc(pc.localDescription,true),lbl=tg?'[Jawaban untuk ID '+tg+' · Tim '+team+'] ':'[Jawaban Tim '+team+'] ';
  $('ans').innerHTML=`<p><b>Langkah 2.</b> Salin kode jawaban ini dan kirim balik ke guru:</p><textarea id="ac" rows="4" inputmode="none" onfocus="this.select()" ${TA}>${lbl}${c}</textarea><p><button class="btn" id="cp">📋 Salin Kode Jawaban</button> <button class="btn" id="sd">📤 Kirim ke Guru</button> <button class="btn l" id="fl">Coba kode ringkas</button></p><p id="ps">Menunggu guru menyambungkan…</p>`;if(/\.local\b/.test(pc.localDescription.sdp)&&!lanStream)$('ps').textContent+=' '+NOTE;setTimeout(()=>{const e=$('ps');if(e)e.textContent=ADV2+' '+NOTE},45000);$('cp').onclick=()=>copy('ac');$('sd').onclick=()=>send($('ac').value);$('fl').onclick=()=>{$('ac').value=lbl+enc(pc.localDescription);toast('Kode ringkas ditampilkan. Salin lagi.')}}
  catch(e){const m=errm(e);$('er').textContent=m;toast(m);role='';document.body.classList.remove('player')}}}
function pub(){if(role!=='h'||!R)return;
 R.presence({r:'h',b:own.map(x=>x||'.').join(''),sx:score.X,so:score.O,t:turn,n:++seq,
  q:cur?{c:cur.i,k:BANK.indexOf(cur.q),o:cur.opts.map(x=>cur.q.indexOf(x.t)-2).join('')}:null}).catch(()=>{})}
function hostPeers(){if(role!=='h')return;const ps=R.peers();const n=t=>ps.filter(p=>p.presence.team===t).length;
 $('st').innerHTML=`<span>Perangkat terhubung: ${ps.length}</span><span>Tim X: ${n('X')}</span><span>Tim O: ${n('O')}</span>`;
 slots.forEach(x=>{const ok=!!PP[x.id];x.ss.textContent=ok?'✓ tersambung · Tim '+(PP[x.id].team||'?'):!x.applied?'menunggu jawaban…':(x.st==='failed'||x.st==='disconnected')?'gagal tersambung':'menghubungkan…';if(ok)x.el.querySelector('.er').textContent=''});
 if(!cur)return;const k=BANK.indexOf(cur.q);
 for(const p of ps){const a=p.presence.a;if(p.presence.team===turn&&a&&a.k===k&&a.c===cur.i&&Number.isInteger(a.p)&&a.p>=0&&a.p<5){if(!ap){ap=true;const bs=$('qm').querySelectorAll('.opt');if(bs[a.p])bs[a.p].style.background='#dbeafe';toast('Tim '+turn+' memilih '+L[a.p]);setTimeout(()=>{ap=false;if(cur&&BANK.indexOf(cur.q)===k&&cur.i===a.c)answer(a.p)},900)}break}}}
function showQ(q,t){const Q=BANK[q.k];if(!Q)return;const mine=t===myTeam;
 $('qm').innerHTML=`<h2>Kotak ${q.c+1} · Giliran Tim ${t}${mine?' (Tim Anda)':''}</h2><div class="tm"><div class="bar"><div id="tb"></div></div><b id="tt">30</b></div>${Q[0]?`<div class="ref">${REF[Q[0]]||esc(Q[0].slice(1))}</div>`:''}<div class="q">${esc(Q[1])}</div>`+
 [...q.o].map((x,p)=>`<button class="opt" data-p="${p}"${mine?'':' disabled'}><i>${L[p]}</i><span>${esc(Q[2+Number(x)])}</span></button>`).join('')+(mine?'':`<p>Menunggu Tim ${t} menjawab…</p>`);
 $('qm').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{R.presence({a:{k:q.k,c:q.c,p:+b.dataset.p}});$('qm').querySelectorAll('.opt').forEach(o=>o.disabled=true);b.style.borderColor='#2563eb';toast('Jawaban terkirim')});
 $('qov').classList.add('show');clearInterval(tI);tL=30;tick();tI=setInterval(()=>{tL=Math.max(0,tL-1);tick()},1000)}
function playerPeers(){if(role!=='p')return;const s=hostPres;
 if(!s||s.r!=='h'){$('st').innerHTML='<span>Menunggu data dari host…</span>';return}
 $('st').innerHTML=`<span>Anda: Tim ${myTeam}</span><span>Tersambung ke host</span>`;
 const b=String(s.b||'.'.repeat(16));
 $('sx').textContent=s.sx;$('so').textContent=s.so;$('bx').classList.toggle('on',s.t==='X');$('bo').classList.toggle('on',s.t==='O');
 const cells=$('board').children;
 for(let i=0;i<16;i++){const c=b[i],cl=cells[i],was=cl.classList.contains('x')?'X':cl.classList.contains('o')?'O':'.';
  if(c!==was){cl.className='cell';if(c==='X'||c==='O'){cl.classList.add(c.toLowerCase());cl.innerHTML=`<span>${c}</span>`}else cl.textContent=i+1}}
 const ws=LINES.filter(l=>l.every(c=>b[c]!=='.'&&b[c]===b[l[0]])),key=ws.map(l=>l.join()).join('|');
 if(key!==lastKey){lastKey=key;$('wl').innerHTML=ws.map(l=>{const p=c=>[(c%4+.5)*25,(Math.floor(c/4)+.5)*25],a=p(l[0]),z=p(l[3]);return `<line x1="${a[0]}" y1="${a[1]}" x2="${z[0]}" y2="${z[1]}"/>`}).join('')}
 const q=s.q;
 if(q){const id=q.k+'-'+q.c;if(id!==curK){curK=id;R.presence({a:null});showQ(q,s.t)}}
 else if(curK){curK='';$('qov').classList.remove('show');clearInterval(tI);
  const cnt=x=>[...x].filter(z=>z!=='.').length;if(cnt(b)>cnt(lastB))sfx(s.t==='X'?'O':'X');else buzz()}
 lastB=b}
$('pb').onclick=pmenu;
init();
</script></body></html>
